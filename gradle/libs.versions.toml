# Toolchain versions match the Killer Sudoku project (known to build on this machine).
# AGP 9 has built-in Kotlin support, so :app does not apply org.jetbrains.kotlin.android.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
junit = "6.1.3"
kotest = "6.2.5"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
coroutines = "1.10.2"
navigationCompose = "2.10.1"
datastore = "1.2.1"
room = "2.8.5"
coil = "3.6.3"
exifinterface = "1.4.2"
reorderable = "3.1.0"
# On-device ML Kit: free, no API key, no server.
docScanner = "16.0.0"
codeScanner = "16.1.0"
textRecognition = "16.0.1"
textRecognitionLatin = "19.0.1"
translate = "17.0.3"
languageId = "17.0.0"
pdfbox = "2.0.27.0"
tesseract = "4.8.0"
zxing = "3.5.4"
biometric = "1.1.0"
appcompat = "1.7.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "docScanner" }
mlkit-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
# OCR through Play services: models are fetched by Play services, not bundled, so the APK stays small.
mlkit-text-latin = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "textRecognitionLatin" }
mlkit-text-devanagari = { module = "com.google.android.gms:play-services-mlkit-text-recognition-devanagari", version.ref = "textRecognition" }
mlkit-text-chinese = { module = "com.google.android.gms:play-services-mlkit-text-recognition-chinese", version.ref = "textRecognition" }
mlkit-text-japanese = { module = "com.google.android.gms:play-services-mlkit-text-recognition-japanese", version.ref = "textRecognition" }
mlkit-text-korean = { module = "com.google.android.gms:play-services-mlkit-text-recognition-korean", version.ref = "textRecognition" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "translate" }
mlkit-language-id = { module = "com.google.android.gms:play-services-mlkit-language-id", version.ref = "languageId" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
# OpenMP build: uses several cores, noticeably faster on phones.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
tesseract-android = { module = "com.github.adaptech-cz.Tesseract4Android:tesseract4android-openmp", version.ref = "tesseract" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test ={ module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
